[project]
name = "lung"
version = "0.1.0"
description = "Lung Exposure Tracker: API and worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
    "valkey[libvalkey]>=6.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lung"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
    "S101",                       # assert is fine in tests
    "RUF001", "RUF002", "RUF003", # µ, ³ and × are intentional in maths text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # fake secrets; seeded RNG for Monte Carlo
"src/lung/api/schemas/**" = ["RUF012"]  # pydantic copies mutable defaults per instance

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["lung"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Postgres, Valkey and ElasticMQ running"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[[tool.mypy.overrides]]
module = ["aioboto3", "aioboto3.*"]
ignore_missing_imports = true
