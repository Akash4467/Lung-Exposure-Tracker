# Areas kept fresh before anyone lives there, so a new user's first score is instant.
# The worker re-fetches these every tick (hourly), together with every area users already
# use. Each 0.1° area (~11 km) costs 2 Open-Meteo calls an hour: keep the total well under
# the free plan's ~10,000 calls/day (48 + 10 areas here ≈ 2,800/day).
#
# boxes:  every 0.1° area inside [south, west, north, east]
# points: just the area around each point (a city centre)

boxes:
  - name: Delhi NCR       # Delhi, Gurugram, Noida, Ghaziabad, Faridabad
    south: 28.4
    west: 76.9
    north: 28.9
    east: 77.6

points:
  - {name: Mumbai, lat: 19.076, lon: 72.878}
  - {name: Bengaluru, lat: 12.972, lon: 77.595}
  - {name: Kolkata, lat: 22.573, lon: 88.364}
  - {name: Chennai, lat: 13.083, lon: 80.271}
  - {name: Hyderabad, lat: 17.385, lon: 78.487}
  - {name: Pune, lat: 18.520, lon: 73.857}
  - {name: Ahmedabad, lat: 23.023, lon: 72.571}
  - {name: Lucknow, lat: 26.847, lon: 80.946}
  - {name: Jaipur, lat: 26.912, lon: 75.787}
  - {name: Chandigarh, lat: 30.733, lon: 76.779}
