# Local stand-in for SQS. Mirrors the queues in infra/modules/queue:
# visibility timeout 60s, and 5 failed receives move a message to its DLQ.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  ingest-jobs-dlq { }
  user-jobs-dlq { }

  ingest-jobs {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "ingest-jobs-dlq", maxReceiveCount = 5 }
  }
  user-jobs {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "user-jobs-dlq", maxReceiveCount = 5 }
  }
}
