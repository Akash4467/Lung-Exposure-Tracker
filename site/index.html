<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lung Exposure Tracker</title>
  <meta name="description" content="Estimate how much polluted air you breathe each day, and what to change.">
  <style>
    :root { --bg: #f7f7f4; --fg: #1d1d1b; --muted: #5b5b57; --accent: #2f6f4f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecece8; --muted: #a3a39d; --accent: #7cc49b; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 16px; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 12px; }
    p { color: var(--muted); }
    .note { font-size: .9rem; margin-top: 40px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Lung Exposure Tracker</h1>
    <p>Know what your lungs took in today, and what to change tomorrow.</p>
    <p>The Android app is coming soon.</p>
    <p class="note">Estimated exposure only. Informational, not medical advice.</p>
  </main>
</body>
</html>
